<linearGradient id="desktop" x2="1" y2="1"><stop stop-color="#24334A"/><stop offset="1" stop-color="#201C39"/></linearGradient>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#C8D8F3" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1500" height="460" fill="url(#bg)"/><rect width="1500" height="460" fill="url(#grid)"/>
