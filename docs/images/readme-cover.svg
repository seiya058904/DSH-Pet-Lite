<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="460" viewBox="0 0 1500 460" role="img" aria-labelledby="t d">
<title id="t">DSH Pet Lite — desktop pet, lighter package</title>
<desc id="d">Original abstract vector cover: a desktop frame, small generic pet silhouette, purple neon accent lines and distinct Core and Ultra labels. This is not a screenshot or rendering of the licensed character.</desc>
