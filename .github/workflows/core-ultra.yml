name: Core and Ultra validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  edition:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        edition: [core, ultra]
    env:
      DSH_TEST_EDITION: ${{ matrix.edition }}
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: lite/requirements-lock.txt
      - run: python -m venv .venv
      - run: .venv\Scripts\python.exe -m pip install -r lite/requirements-lock.txt
      - run: .venv\Scripts\python.exe -m ruff check lite
      - run: .venv\Scripts\python.exe -m pytest -q
      - name: Build real edition assets and verify resource/import/license closure
        shell: pwsh
        run: ./lite/build.ps1 -Edition $env:DSH_TEST_EDITION -SkipTests
      - name: Check complete ZIP CRC and embedded edition
        run: .venv\Scripts\python.exe lite/check_release_zip.py --edition $env:DSH_TEST_EDITION --dist dist/core-ultra
      - run: git diff --check
      - name: State desktop acceptance boundary
        run: Write-Output 'Real asset/build checks. Offscreen CI is not real Windows pointer or tray acceptance. Release uses the exact locally tested ZIP bytes.'
